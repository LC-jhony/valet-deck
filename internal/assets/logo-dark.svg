      <stop offset="0%"  stop-color="#FF3528"/>
      <stop offset="100%" stop-color="#CC1B11"/>
    </linearGradient>
  </defs>

  <!-- Contenedor redondeado -->
  <rect x="10" y="10" width="180" height="180" rx="44" ry="44" fill="#000000"/>

